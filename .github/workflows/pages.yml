name: Deploy MyBody2.0 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build versioned production site
        shell: bash
        run: |
          set -euo pipefail
          BUILD="${{ github.run_number }}"
          printf '{"build":"%s"}\n' "$BUILD" > build.json
          cp index-production.html index.html
          sed -i '/production.css?v=__BUILD__/a\  <link rel="stylesheet" href="coach.css?v=__BUILD__">\n  <link rel="stylesheet" href="phase2.css?v=__BUILD__">\n  <link rel="stylesheet" href="workout-redesign.css?v=__BUILD__">\n  <link rel="stylesheet" href="today-redesign.css?v=__BUILD__">\n  <link rel="stylesheet" href="phase3.css?v=__BUILD__">\n  <link rel="stylesheet" href="phase4.css?v=__BUILD__">\n  <link rel="stylesheet" href="phase5.css?v=__BUILD__">\n  <link rel="stylesheet" href="experience-core.css?v=__BUILD__">\n  <link rel="stylesheet" href="experience-v2.css?v=__BUILD__">\n  <link rel="stylesheet" href="admin-dashboard.css?v=__BUILD__">' index.html
          sed -i '/food-data.js?v=__BUILD__/i\  <script src="supabase-cloud.js?v=__BUILD__" defer></script>' index.html
          sed -i '/core-storage.js?v=__BUILD__/a\  <script src="coach-engine.js?v=__BUILD__" defer></script>\n  <script src="coach-guard.js?v=__BUILD__" defer></script>' index.html
          sed -i '/app-production.js?v=__BUILD__/a\  <script src="coach-ui.js?v=__BUILD__" defer></script>\n  <script src="phase2.js?v=__BUILD__" defer></script>\n  <script src="workout-redesign.js?v=__BUILD__" defer></script>\n  <script src="today-redesign.js?v=__BUILD__" defer></script>\n  <script src="phase3.js?v=__BUILD__" defer></script>\n  <script src="phase4.js?v=__BUILD__" defer></script>\n  <script src="phase5.js?v=__BUILD__" defer></script>\n  <script src="experience-core.js?v=__BUILD__" defer></script>\n  <script src="experience-coach-actions.js?v=__BUILD__" defer></script>\n  <script src="experience-food.js?v=__BUILD__" defer></script>\n  <script src="experience-workout.js?v=__BUILD__" defer></script>\n  <script src="experience-progress.js?v=__BUILD__" defer></script>\n  <script src="experience-launch.js?v=__BUILD__" defer></script>\n  <script src="experience-telemetry.js?v=__BUILD__" defer></script>' index.html
          sed -i '/auth-onboarding.js?v=__BUILD__/a\  <script src="cloud-auto-connect.js?v=__BUILD__" defer></script>\n  <script src="login-forgot-password.js?v=__BUILD__" defer></script>\n  <script src="admin-ui.js?v=__BUILD__" defer></script>\n  <script src="profile-dropdown.js?v=__BUILD__" defer></script>' index.html
          sed -i "s/__BUILD__/$BUILD/g" index.html service-worker.js manifest.json
          cp index.html latest.html

      - name: Validate production assets
        run: |
          set -euo pipefail
          test -s index.html
          test -s production.css
          test -s coach.css
          test -s phase2.css
          test -s workout-redesign.css
          test -s today-redesign.css
          test -s phase3.css
          test -s phase4.css
          test -s phase5.css
          test -s experience-core.css
          test -s experience-v2.css
          test -s app-production.js
          test -s coach-engine.js
          test -s coach-guard.js
          test -s coach-ui.js
          test -s phase2.js
          test -s workout-redesign.js
          test -s today-redesign.js
          test -s phase3.js
          test -s phase4.js
          test -s phase5.js
          test -s experience-core.js
          test -s experience-coach-actions.js
          test -s experience-food.js
          test -s experience-workout.js
          test -s experience-progress.js
          test -s experience-launch.js
          test -s experience-telemetry.js
          test -s exercise-library.js
          test -s core-storage.js
          test -s supabase-cloud.js
          test -s cloud-auto-connect.js
          test -s login-forgot-password.js
          test -s admin-ui.js
          test -s profile-dropdown.js
          test -s admin-dashboard.css
          test -s supabase/functions/ios-step-sync/index.ts
          test -s supabase/migrations/20260816123000_create_ios_step_sync.sql
          test -s supabase/migrations/20260819031500_create_product_analytics.sql
          test -s tests/browser-e2e.mjs
          test -s assets/workout-hero.webp
          test "$(find assets/exercises/avatars -type f -name '*.mp4' | wc -l)" -eq 42
          test "$(find assets/exercises/avatars -type f -name '*.webp' | wc -l)" -eq 42
          for id in dumbbell-bench-press incline-dumbbell-press dumbbell-chest-fly one-arm-dumbbell-row lat-pulldown seated-cable-row lateral-raise rear-delt-fly dumbbell-biceps-curl hammer-curl rope-pushdown overhead-triceps-extension romanian-deadlift back-squat leg-curl leg-extension; do test -s "assets/exercises/real/$id.mp4"; test -s "assets/exercises/real/$id.webp"; done
          find assets/exercises/avatars -type f \( -name '*.mp4' -o -name '*.webp' \) -exec test -s {} \;
          ! grep -R "__BUILD__" index.html service-worker.js manifest.json
          grep -q 'id="pullRefresh"' index.html
          grep -q 'id="workoutHistory"' index.html
          grep -q 'id="foodHistory"' index.html
          grep -q 'id="progressList"' index.html
          for asset in coach.css phase2.css workout-redesign.css today-redesign.css phase3.css phase4.css phase5.css experience-core.css experience-v2.css coach-engine.js coach-guard.js coach-ui.js phase2.js workout-redesign.js today-redesign.js phase3.js phase4.js phase5.js experience-core.js experience-coach-actions.js experience-food.js experience-workout.js experience-progress.js experience-launch.js experience-telemetry.js supabase-cloud.js cloud-auto-connect.js login-forgot-password.js admin-ui.js profile-dropdown.js; do grep -q "$asset" index.html; done
          ! grep -q 'auth-production-redirect.js' index.html
          ! grep -q 'cloud-auth-bridge.js' index.html
          ! grep -q 'HistorySheet' index.html
          node --check core-storage.js
          node --check food-data.js
          node --check exercise-library.js
          node --check coach-engine.js
          node --check coach-guard.js
          node --check coach-ui.js
          node --check phase2.js
          node --check workout-redesign.js
          node --check today-redesign.js
          node --check phase3.js
          node --check phase4.js
          node --check phase5.js
          node --check experience-core.js
          node --check experience-coach-actions.js
          node --check experience-food.js
          node --check experience-workout.js
          node --check experience-progress.js
          node --check experience-launch.js
          node --check experience-telemetry.js
          node --check app-production.js
          node --check health-sync.js
          node --check navigation-fix.js
          node --check build-live.js
          node --check supabase-cloud.js
          node --check cloud-auto-connect.js
          node --check login-forgot-password.js
          node --check admin-ui.js
          node --check profile-dropdown.js
          node --check service-worker.js
          node tests/production-smoke.js

      - name: Mobile browser E2E
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 >/tmp/mybody-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node tests/browser-e2e.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
