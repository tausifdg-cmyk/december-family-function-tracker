name: Deploy MyBody2.0 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write live build number
        run: printf '{"build":"%s"}\n' "${{ github.run_number }}" > build.json

      - name: Add current mobile fixes
        run: |
          sed -i 's#</head>#<link rel="stylesheet" href="settings-mobile-fix.css?v=${{ github.run_number }}"><link rel="stylesheet" href="navigation-fix.css?v=${{ github.run_number }}"></head>#' index.html
          sed -i 's#</body>#<script src="stability-fixes-129.js?v=${{ github.run_number }}"></script><script src="build-live.js?v=${{ github.run_number }}"></script><script src="navigation-fix.js?v=${{ github.run_number }}"></script></body>#' index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
