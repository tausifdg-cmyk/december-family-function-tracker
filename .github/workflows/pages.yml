name: Deploy MyBody2.0 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write live build number
        run: printf '{"build":"%s"}\n' "${{ github.run_number }}" > build.json

      - name: Add current mobile fixes
        run: |
          sed -i -E 's/\?v=[0-9]+/?v=${{ github.run_number }}/g' index.html
          sed -i -E "s/DEFAULT_BUILD='[0-9]+'/DEFAULT_BUILD='${{ github.run_number }}'/" workout-prefill-fix.js
          sed -i 's|<button class="tab active" data-tab="today">Today</button>|<a class="tab active" data-tab="today" href="#today">Today</a>|' index.html
          sed -i 's|<button class="tab" data-tab="workout">Workout</button>|<a class="tab" data-tab="workout" href="#workout">Workout</a>|' index.html
          sed -i 's|<button class="tab" data-tab="food">Food</button>|<a class="tab" data-tab="food" href="#food">Food</a>|' index.html
          sed -i 's|<button class="tab" data-tab="progress">Progress</button>|<a class="tab" data-tab="progress" href="#progress">Progress</a>|' index.html
          sed -i 's|<button class="tab" data-tab="settings">Settings</button>|<a class="tab" data-tab="settings" href="#settings">Settings</a>|' index.html
          sed -i 's#</head>#<link rel="stylesheet" href="settings-mobile-fix.css?v=${{ github.run_number }}"><link rel="stylesheet" href="navigation-fix.css?v=${{ github.run_number }}"></head>#' index.html
          sed -i 's#</body>#<script src="build-live.js?v=${{ github.run_number }}"></script><script src="navigation-fix.js?v=${{ github.run_number }}"></script></body>#' index.html
          cp index.html latest.html
          sed -i 's#"start_url":"./"#"start_url":"./latest.html"#' manifest.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
