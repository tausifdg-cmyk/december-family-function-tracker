name: Android Health Connect Build

on:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build test APK
        working-directory: android-native
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare installer
        run: cp android-native/app/build/outputs/apk/debug/app-debug.apk mybody-android.apk
      - name: Publish latest test installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest mybody-android.apk --clobber
          else
            gh release create android-latest mybody-android.apk --title "MYBODY Android test app" --notes "Health Connect test installer. Direct-install build; no Play developer account required."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mybody-android
          path: mybody-android.apk
